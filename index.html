<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ER:LC Web CAD</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b10;
    color: #f5f5f5;
    display: flex;
    height: 100vh;
  }

  .sidebar {
    width: 230px;
    background: #11131a;
    padding: 16px;
    border-right: 1px solid #222;
  }
  .sidebar h2 {
    margin: 0 0 12px;
    color: #4fc3f7;
  }
  .sidebar button {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    background: #1a1d27;
    border: 1px solid #333;
    color: #f5f5f5;
    border-radius: 6px;
    cursor: pointer;
  }
  .sidebar button:hover {
    background: #232736;
  }

  .main {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    height: 100vh;
  }

  .panel {
    background: #141722;
    border-radius: 10px;
    border: 1px solid #333;
    padding: 14px;
    margin-bottom: 14px;
  }
  .panel h3 {
    margin: 0 0 10px;
    color: #4fc3f7;
  }

  label {
    display: block;
    font-size: 0.85rem;
    margin-top: 6px;
  }
  input, select, textarea {
    width: 100%;
    padding: 6px;
    margin-top: 2px;
    background: #0f1118;
    border: 1px solid #333;
    color: #f5f5f5;
    border-radius: 4px;
    font-size: 0.85rem;
  }
  textarea {
    resize: vertical;
    min-height: 60px;
  }

  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .row > div {
    flex: 1;
    min-width: 140px;
  }

  .btn-primary {
    margin-top: 10px;
    padding: 8px 12px;
    background: #4fc3f7;
    border: none;
    color: #000;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-primary:hover {
    background: #81d4fa;
  }

  .call-card {
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: #181b26;
    font-size: 0.9rem;
  }

  .call-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
    margin-right: 4px;
  }
  .tag-prio1 { background: #81c784; }
  .tag-prio2 { background: #ffb74d; }
  .tag-prio3 { background: #e57373; }

  .status-pill {
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.75rem;
    background: #4fc3f7;
    color: #000;
  }

  #pttBtn {
    padding: 10px 16px;
    background: #e57373;
    border: none;
    color: #000;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  #pttBtn:active {
    background: #ef9a9a;
  }
</style>
</head>

<body>

<div class="sidebar">
  <h2>ER:LC CAD</h2>
  <button onclick="showPanel('create')">Create Call</button>
  <button onclick="showPanel('active')">Active Calls</button>
  <button onclick="showPanel('closed')">Closed Calls</button>
  <button onclick="showPanel('dispatch')">Dispatch Console</button>
  <button onclick="showPanel('login')">Unit Login</button>
  <button onclick="showPanel('radio')">Radio</button>

  <!-- MDT separate page -->
  <button onclick="window.location.href='mdt.html'">Unit MDT</button>
</div>

<div class="main">

  <!-- CREATE CALL PANEL -->
  <div class="panel" id="panel-create">
    <h3>Create New Call</h3>

    <div class="row">
      <div>
        <label>Call Type</label>
        <select id="callType">
          <option>Traffic Stop</option>
          <option>Pursuit</option>
          <option>Robbery</option>
          <option>Suspicious Person</option>
          <option>Medical</option>
          <option>Disturbance</option>
        </select>
      </div>

      <div>
        <label>Priority</label>
        <select id="priority">
          <option value="1">1 - Low</option>
          <option value="2">2 - Medium</option>
          <option value="3">3 - High</option>
        </select>
      </div>

      <div>
        <label>Server</label>
        <select id="server">
          <option>UK</option>
          <option>US</option>
          <option>EU</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Location</label>
        <input id="location" placeholder="Road / landmark">
      </div>
      <div>
        <label>Postal</label>
        <input id="postal" placeholder="603">
      </div>
      <div>
        <label>Caller</label>
        <input id="caller" placeholder="Anonymous / Civ name">
      </div>
